<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Manchester Funerals — Coming soon</title>
<meta name="description" content="Manchester Funerals. Our new website is coming soon.">
<meta name="theme-color" content="#424642">

<meta property="og:type" content="website">
<meta property="og:title" content="Manchester Funerals">
<meta property="og:description" content="Our new website is coming soon.">
<meta property="og:url" content="https://manchesterfunerals.co.uk/">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://p.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/glf6otm.css">

<link rel="preload" as="image" href="assets/img/poster.webp" fetchpriority="high">

<style>
  /* --- Brand ------------------------------------------------------- */
  :root {
    --brand:      #424642;   /* main colour */
    --ink:        #ffffff;
    --veil:       rgba(66, 70, 66, .68);   /* brand tint over the photo   */
    --vignette-1: rgba(18, 21, 18, .30);   /* centre of the darkening     */
    --vignette-2: rgba(18, 21, 18, .68);   /* edges of the darkening      */
  }

  /* --- Reset ------------------------------------------------------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--brand);          /* shows before the photo loads */
    color: var(--ink);
    font-family: "museo-sans-rounded", ui-rounded, "SF Pro Rounded",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Background video --------------------------------------------- */
  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    z-index: 0;
  }

  /* --- Darkening layer (brand veil + vignette) ---------------------- */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse 92% 72% at 50% 45%, var(--vignette-1), var(--vignette-2)),
      linear-gradient(var(--veil), var(--veil));
  }

  /* --- Content ------------------------------------------------------ */
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2rem, 5vh, 3.5rem);
    padding: clamp(1.5rem, 6vw, 4rem);
    text-align: center;
  }

  .logo {
    width: min(680px, 84vw);
    height: auto;
    display: block;
  }

  .coming {
    margin: 0;
    font-size: clamp(.9rem, 1.9vw, 1.25rem);
    font-weight: 300;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .92);
  }

  @media (prefers-reduced-motion: no-preference) {
    .logo, .coming { animation: rise .9s cubic-bezier(.22, 1, .36, 1) both; }
    .coming { animation-delay: .18s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>

<video class="bg" poster="assets/img/poster.webp"
       autoplay muted loop playsinline preload="auto"
       aria-hidden="true" tabindex="-1">
  <source src="assets/video/bg.mp4" type="video/mp4">
</video>

<script>
  /* Anyone who asked the system for less motion gets the poster frame, not the loop. */
  (function () {
    var v = document.querySelector('.bg');
    if (v && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      v.removeAttribute('autoplay');
      v.pause();
    }
  })();
</script>

<div class="veil"></div>

<main class="stage">
  <img class="logo" src="assets/img/logo-white.svg" alt="Manchester Funerals">
  <p class="coming">Coming soon</p>
</main>

</body>
</html>
