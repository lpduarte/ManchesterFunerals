<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Manchester Funerals — Coming soon</title>
<meta name="description" content="Manchester Funerals. Our new website is coming soon.">
<meta name="theme-color" content="#424642">

<meta property="og:type" content="website">
<meta property="og:title" content="Manchester Funerals">
<meta property="og:description" content="Our new website is coming soon.">
<meta property="og:url" content="https://manchesterfunerals.co.uk/">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="preconnect" href="https://p.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/glf6otm.css">

<link rel="preload" as="image" fetchpriority="high"
      href="assets/img/moor-3200.webp"
      imagesrcset="assets/img/moor-2560.webp 2560w,
                   assets/img/moor-3200.webp 3200w,
                   assets/img/moor-4096.webp 4096w"
      imagesizes="100vw">

<style>
  /* --- Brand ------------------------------------------------------- */
  :root {
    --brand:      #424642;   /* main colour */
    --ink:        #ffffff;
    --veil:       rgba(66, 70, 66, .68);   /* brand tint over the photo   */
    --vignette-1: rgba(18, 21, 18, .30);   /* centre of the darkening     */
    --vignette-2: rgba(18, 21, 18, .68);   /* edges of the darkening      */
  }

  /* --- Reset ------------------------------------------------------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--brand);          /* shows before the photo loads */
    color: var(--ink);
    font-family: "museo-sans-rounded", ui-rounded, "SF Pro Rounded",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- Background image --------------------------------------------- */
  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    z-index: 0;
  }

  /* --- Darkening layer (brand veil + vignette) ---------------------- */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse 92% 72% at 50% 45%, var(--vignette-1), var(--vignette-2)),
      linear-gradient(var(--veil), var(--veil));
  }

  /* --- Content ------------------------------------------------------ */
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(2rem, 5vh, 3.5rem);
    padding: clamp(1.5rem, 6vw, 4rem);
    padding-bottom: clamp(4rem, 12vh, 6rem);
    text-align: center;
  }

  .logo {
    width: min(680px, 84vw);
    height: auto;
    display: block;
  }

  .coming {
    margin: 0;
    font-size: clamp(.9rem, 1.9vw, 1.25rem);
    font-weight: 300;
    letter-spacing: .34em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .92);
  }

  /* --- Photo credit (CC BY-SA 2.0 requires it on the page) ---------- */
  .credit {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    padding: 0 clamp(1rem, 4vw, 2rem)
             calc(clamp(.7rem, 2vh, 1.1rem) + env(safe-area-inset-bottom, 0px));
    font-size: clamp(.58rem, 1.1vw, .7rem);
    font-weight: 300;
    letter-spacing: .06em;
    line-height: 1.5;
    text-align: center;
    text-wrap: balance;
    color: rgba(255, 255, 255, .38);
  }

  .credit a {
    color: inherit;
    text-decoration-color: rgba(255, 255, 255, .22);
    text-underline-offset: .25em;
  }

  .credit a:hover,
  .credit a:focus-visible { color: rgba(255, 255, 255, .72); }

  @media (prefers-reduced-motion: no-preference) {
    .logo, .coming { animation: rise .9s cubic-bezier(.22, 1, .36, 1) both; }
    .coming { animation-delay: .18s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>

<picture>
  <source media="(orientation: portrait)"
          srcset="assets/img/moor-portrait-1536.webp">
  <img class="bg" alt="" aria-hidden="true" fetchpriority="high" decoding="async"
       src="assets/img/moor-3200.webp"
       srcset="assets/img/moor-2560.webp 2560w,
               assets/img/moor-3200.webp 3200w,
               assets/img/moor-4096.webp 4096w"
       sizes="100vw">
</picture>

<div class="veil"></div>

<main class="stage">
  <img class="logo" src="assets/img/logo-white.svg" alt="Manchester Funerals">
  <p class="coming">Coming soon</p>
</main>

<p class="credit">
  Background: <a href="https://www.geograph.org.uk/photo/5485216">Saddleworth Moor</a>
  &copy; <a href="https://www.geograph.org.uk/profile/32256">Roger Cornfoot</a>,
  licensed under <a href="https://creativecommons.org/licenses/by-sa/2.0/" rel="license">CC BY-SA 2.0</a>.
  Cropped and desaturated; this adaptation is shared under the same licence.
</p>

</body>
</html>
